<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgroMap2DSakha — Навигация АГАТУ</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
  <div class="logo">
  <img src="photos/logo.png" alt="Логотип" style="height: 40px; object-fit: contain; vertical-align: middle;">
</div>
    <input type="text" id="search" placeholder="Поиск объекта..." />
    <select id="styleSelect" title="Стиль карты">
      <option value="osm">🗺️  Схема</option>
      <option value="satellite">🛰️  Спутник</option>
    </select>
    <button id="locateBtn" title="Моё местоположение">📍 </button>
    <button id="addBtn" title="Добавить объект">➕</button>
  </header>
  <aside class="sidebar">
    <h3>Быстрый переход</h3>
<button class="quick-btn" data-target="agatu">🏫  АГАТУ</button>
<button class="quick-btn" data-target="manezh">🏟️  Манеж</button>
<button class="quick-btn" data-target="teplica">🌱  Теплица</button>
<button class="quick-btn" data-target="oktemskiy">🏫  Октемский Филиал</button>

    <h3>Маршрут</h3>
    <button id="routeBtn">🚶  Маршрут Агро тропы</button>
    <button id="clearRouteBtn">✖ Очистить маршрут</button>
    <div id="routeInfo" class="route-info hidden"></div>
    <div id="resultList" class="result-list"></div>
  </aside>

  <div id="map"></div>

  <div id="infoCard" class="info-card hidden">
    <button class="close-btn" id="closeCard">✖</button>
    <h2 id="cardTitle"></h2>
    <p id="cardType"></p>
    <p id="cardDesc"></p>
    <button id="routeToCard">🚶  Маршрут сюда</button>
    <button id="showPlan" class="secondary hidden">🏢  Внутренняя карта (2D)</button>
    <button id="editModeBtn" class="secondary hidden" style="background: #ff9800 !important; color: white !important; margin-top: 5px;">🛠 Режим редактирования</button>
  </div>

<div id="planModal" class="modal hidden">
  <div class="modal-content" style="max-width: 900px; padding: 0; overflow: hidden; background: #fff;">
    <button class="close-btn" id="closePlan" style="z-index: 10000; color: #fff; background: rgba(0,0,0,0.5); border-radius: 50%; width: 30px; height: 30px; top: 10px; right: 15px; font-size: 20px;">✖</button>
    
    <!-- Заголовок с названием здания -->
    <h2 id="planTitle" style="padding: 15px 20px; margin: 0; background: #1b5e20; color: #fff;"></h2>
    
    <!-- Кнопки выбора этажа -->
    <div id="floorButtons" style="display: flex; gap: 10px; padding: 10px 20px; background: #eee; overflow-x: auto; flex-wrap: wrap;"></div>

    <!-- Карта для чертежа (Leaflet) -->
    <div id="planMap" style="width: 100%; height: 550px; background: #f0f0f0; z-index: 1;"></div>
    
    <!-- Кнопка сброса больше не нужна, можно оставить пустую панель для красоты -->
    <div style="padding: 10px; background: #333; text-align: center; color: #aaa; font-size: 12px;">
      Используйте колесико мыши для приближения
    </div>
  </div>
</div>

  <!-- ИИ-Ассистент (кнопка) -->
 <button id="aiBtn" style="position: fixed; bottom: 20px; right: 20px; width: 65px; height: 65px; border-radius: 50%; background: white; border: 2px solid #1b5e20; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 1000; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 5px;">
  <img src="photos/ai-logo.png" alt="ИИ" style="width: 100%; height: 100%; object-fit: contain;">
</button>

  <!-- ИИ-Ассистент (окно чата) -->
  <div id="aiChat" style="position: fixed; bottom: 90px; right: 20px; width: 320px; height: 450px; background: white; border-radius: 10px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); display: none; flex-direction: column; z-index: 1000; overflow: hidden; border: 1px solid #ddd;">

<div style="background: #1b5e20; color: white; padding: 15px; font-weight: bold; display: flex; justify-content: space-between;">
      <span style="display: flex; align-items: center; gap: 10px;">
  <img src="photos/ai-logo.png" alt="ИИ" style="width: 30px; height: 30px; object-fit: contain; background: white; border-radius: 50%; padding: 2px;">
  Помощник АГАТУ
</span>
      <button id="closeAi" style="background: none; border: none; color: white; cursor: pointer; font-size: 16px;">✖</button>
    </div>
    <div id="aiMessages" style="flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #f9f9f9;">
      <div style="background: #e8f5e9; padding: 10px; border-radius: 8px; align-self: flex-start; max-width: 80%; font-size: 14px;">
        Привет! Я помогу найти нужный кабинет или этаж. Спроси меня: «Где 1.102?» или «Где столовая?».
      </div>
    </div>
    <div id="quickQuestions" style="padding: 10px; display: flex; gap: 5px; flex-wrap: wrap; background: #f0f0f0; border-top: 1px solid #ddd;">
      <button class="q-btn" onclick="askAI('Где столовая?')">Где столовая?</button>
      <button class="q-btn" onclick="askAI('Где 1.102?')">Где 1.102?</button>
    </div>
    <div style="display: flex; padding: 10px; background: white; border-top: 1px solid #ddd;">
      <input type="text" id="aiInput" placeholder="Ваш вопрос..." style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; outline: none;">
      <button id="sendAi" style="background: #1b5e20; color: white; border: none; border-radius: 50%; width: 40px; height: 40px; margin-left: 8px; cursor: pointer;">➤</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Библиотека для 2D-зума и перетаскивания картинок -->
  <script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>
  
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
