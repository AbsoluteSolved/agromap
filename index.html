<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgroMap2DSakha — интерактивная карта</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Шапка -->
  <header class="header">
    <div class="logo">🌾  AgroMap2DSakha</div>
    <input type="text" id="search" placeholder="Поиск объекта..." />

    <!-- Переключатель стилей -->
    <select id="styleSelect" title="Стиль карты">
      <option value="osm">🗺️  Схема</option>
      <option value="satellite">🛰️  Спутник</option>
      <option value="hybrid">🛰️  Спутник + подписи</option>
      <option value="dark">🌙  Тёмная</option>
      <option value="light">☀️  Светлая</option>
      <option value="topo">⛰️  Топо</option>
    </select>

    <button id="locateBtn" title="Моё местоположение">📍 </button>
    <button id="addBtn" title="Добавить объект">➕</button>
  </header>

  <!-- Боковая панель -->
  <aside class="sidebar">
    <h3>Слои карты</h3>
    <label><input type="checkbox" class="layer-toggle" data-layer="buildings" checked /> 🏢  Здания</label>
    <label><input type="checkbox" class="layer-toggle" data-layer="fields" checked /> 🌾  Поля</label>
    <label><input type="checkbox" class="layer-toggle" data-layer="pastures" checked /> 🐄  Пастбища</label>
    <label><input type="checkbox" class="layer-toggle" data-layer="greenhouses" checked /> 🌱  Теплицы</label>

    <h3>Быстрый переход</h3>
    <button class="quick-btn" data-target="agatu">🏫  АГАТУ</button>
    <button class="quick-btn" data-target="agrotropa">🥾  Агротропа</button>

    <h3>Маршрут</h3>
    <button id="routeBtn">🚶  Маршрут до выбранного</button>
    <button id="clearRouteBtn">✖ Очистить маршрут</button>
    <div id="routeInfo" class="route-info hidden"></div>

    <div id="resultList" class="result-list"></div>
  </aside>

  <!-- Карта -->
  <div id="map"></div>

  <!-- Карточка объекта -->
  <div id="infoCard" class="info-card hidden">
    <button class="close-btn" id="closeCard">✖</button>
    <h2 id="cardTitle"></h2>
    <p id="cardType"></p>
    <p id="cardDesc"></p>
    <button id="routeToCard">🚶  Маршрут сюда</button>
    <button id="showPlan" class="secondary hidden">🏢  План здания</button>
  </div>

  <!-- Модальное окно: план здания -->
  <div id="planModal" class="modal hidden">
    <div class="modal-content">
      <button class="close-btn" id="closePlan">✖</button>
      <h2 id="planTitle"></h2>
      <img id="planImage" src="" alt="План здания" />
    </div>
  </div>

  <!-- Модальное окно: добавление объекта -->
  <div id="addModal" class="modal hidden">
    <div class="modal-content">
      <button class="close-btn" id="closeAdd">✖</button>
      <h2>Добавить объект</h2>
      <form id="addForm">
        <label>Название<input type="text" name="name" required /></label>
        <label>Тип
          <select name="type">
            <option value="building">🏢  Здание</option>
            <option value="field">🌾  Поле</option>
            <option value="pasture">🐄  Пастбище</option>
            <option value="greenhouse">🌱  Теплица</option>
          </select>
        </label>
        <label>Описание<textarea name="desc" rows="2"></textarea></label>
        <label>Широта<input type="number" step="any" name="lat" required /></label>
        <label>Долгота<input type="number" step="any" name="lng" required /></label>
        <button type="submit">Сохранить</button>
      </form>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
